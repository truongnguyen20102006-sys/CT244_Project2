<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Student CRUD</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>Student Management</h2>
        <form class="card form-row" action="/add" method="post">
            <input name="rollNo" placeholder="Roll No" required />
            <input name="name" placeholder="Name" required />
            <input name="semester" type="number" placeholder="Semester" required />
            <input name="cgpa" type="number" step="0.01" placeholder="CGPA" required />
            <input name="phoneNumber" placeholder="Phone Number" required />
            <button type="submit">Add Student</button>
        </form>

        <form class="card form-row" action="/delete" method="post">
            <input name="rollNo" placeholder="Roll No" required />
            <button class="btn-danger" type="submit">Delete Student</button>
        </form>

        <div class="card form-row">
            <a href="/display"><button type="button">Display All Students</button></a>
        </div>

        <form class="card form-row" action="/display/" method="get"
            onsubmit="event.preventDefault(); window.location='/display/' + this.rollNo.value;">
            <input name="rollNo" placeholder="Roll No" required />
            <button class="btn-secondary" type="submit">Display One Student</button>
        </form>

        <p class="message" th:text="${message}"></p>
    </div>
</body>

</html>
