<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Student Info</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>Student Info</h2>
        <div class="info" th:if="${student != null}">
            <p><b>Roll No:</b> <span th:text="${student.rollNo}"></span></p>
            <p><b>Name:</b> <span th:text="${student.name}"></span></p>
            <p><b>Semester:</b> <span th:text="${student.semester}"></span></p>
            <p><b>CGPA:</b> <span th:text="${student.cgpa}"></span></p>
            <p><b>Phone:</b> <span th:text="${student.phoneNumber}"></span></p>
            <p><a th:href="@{/edit/{rollNo}(rollNo=${student.rollNo})}">Update Student</a></p>
        </div>
        <div class="empty" th:if="${student == null}">
            <p>No student found.</p>
        </div> <a class="back-link" href="/">Back</a>
    </div>
</body>

</html>
