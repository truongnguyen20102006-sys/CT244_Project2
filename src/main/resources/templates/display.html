<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>All Students</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>All Students</h2>
        <table>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Semester</th>
                <th>CGPA</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
            <tr th:each="s : ${students}">
                <td th:text="${s.rollNo}"></td>
                <td th:text="${s.name}"></td>
                <td th:text="${s.semester}"></td>
                <td th:text="${s.cgpa}"></td>
                <td th:text="${s.phoneNumber}"></td>
                <td><a th:href="@{/edit/{rollNo}(rollNo=${s.rollNo})}">Update</a></td>
            </tr>
        </table> <a class="back-link" href="/">Back</a>
    </div>
</body>

</html>
