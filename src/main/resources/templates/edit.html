<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Update Student</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>Update Student</h2>
        <form class="card" action="/update" method="post">
            <div class="form-group">
                <label>Roll No</label>
                <input name="rollNo" th:value="${student.rollNo}" readonly />
            </div>
            <div class="form-group">
                <label>Name</label>
                <input name="name" th:value="${student.name}" required />
            </div>
            <div class="form-group">
                <label>Semester</label>
                <input name="semester" type="number" min="1" th:value="${student.semester}" required />
            </div>
            <div class="form-group">
                <label>CGPA</label>
                <input name="cgpa" type="number" step="0.01" min="0" max="10" th:value="${student.cgpa}" required />
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input name="phoneNumber" th:value="${student.phoneNumber}" required />
            </div>
            <button type="submit">Update Student</button>
        </form>
        <a class="back-link" href="/display">Back to All Students</a>
    </div>
</body>

</html>
